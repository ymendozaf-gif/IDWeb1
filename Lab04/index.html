<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gestor de Tareas Universitarias</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

    <div class="container-fluid py-5 px-md-5">
        <div class="row justify-content-center">
            <div class="col-xl-11">
                <!-- Tarjeta Principal del Gestor -->
                <div class="card shadow-lg border-0 rounded-3">
                    <div class="card-header bg-primary text-white py-3">
                        <h1 class="h3 mb-0 text-center text-md-start">
                            <i class="bi bi-journal-check me-2"></i>Gestor de Tareas Universitarias
                        </h1>
                    </div>

                    <div class="card-body p-4 p-md-5">
                        <div class="row g-4 p-1">
                            <div class="col-lg-5 col-xl-4 border-end-lg pe-lg-4">
                                <h2 class="h5 mb-4 text-primary fw-bold">
                                    <i class="bi bi-plus-circle me-2"></i>Nueva Tarea
                                </h2>
                                
                                <form id="todo-form">
                                    <div class="mb-3">
                                        <label for="todo-title" class="form-label fw-semibold">Título de la tarea</label>
                                        <input type="text" id="todo-title" class="form-control shadow-sm" placeholder="Ejemplo: Resolver ejercicios">
                                    </div>

                                    <div class="mb-3">
                                        <label for="todo-course" class="form-label fw-semibold">Curso</label>
                                        <input type="text" id="todo-course" class="form-control shadow-sm" placeholder="Ejemplo: Cálculo I">
                                    </div>

                                    <div class="mb-4">
                                        <label for="todo-date" class="form-label fw-semibold">Fecha de entrega</label>
                                        <input type="date" id="todo-date" class="form-control shadow-sm">
                                    </div>

                                    <button type="submit" class="btn btn-primary w-100 shadow-sm py-2 fw-bold">
                                        Agregar tarea
                                    </button>
                                </form>

                                <div id="alertas" class="mt-4"></div>
                            </div>

                            <div class="col-lg-7 col-xl-8 ps-lg-4 mt-5 mt-lg-0">
                                <div class="d-flex flex-wrap align-items-center justify-content-between border-bottom pb-3 mb-4">
                                    <h2 class="h5 mb-2 mb-md-0 text-secondary fw-bold">
                                        <i class="bi bi-funnel me-2"></i>Filtrar tareas
                                    </h2>
                                    <div class="btn-group shadow-sm" role="group" aria-label="Filtros de tareas">
                                        <button id="btn-todas" class="btn btn-outline-secondary px-3 active">Todas</button>
                                        <button id="btn-pendientes" class="btn btn-outline-warning px-3">Pendientes</button>
                                        <button id="btn-completadas" class="btn btn-outline-success px-3">Completadas</button>
                                    </div>
                                </div>

                                <h2 class="h5 mb-3 text-dark fw-bold">
                                    <i class="bi bi-list-task me-2"></i>Lista de tareas
                                </h2>
                                <ul id="todo-list" class="list-group list-group-flush rounded-3 shadow-sm overflow-hidden">
                                </ul>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
