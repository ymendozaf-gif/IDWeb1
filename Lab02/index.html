<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Estudiante</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <form action="/procesar" method="POST" class="form-container">

        <h1>Registro de Estudiante</h1>

        <fieldset>
            <legend>Información Personal</legend>

            <div class="form-group">
                <label for="codigo" class="form-label">
                    Código de estudiante:
                </label>

                <input
                    type="text"
                    id="codigo"
                    name="codigo"
                    class="form-input"
                    required
                    pattern="[0-9]{8}"
                    maxlength="8"
                    placeholder="12345678"
                >
            </div>

            <div class="form-group">
                <label for="nombre" class="form-label">
                    Nombre completo:
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    class="form-input"
                    required
                    placeholder="Ada Lovelace"
                >
            </div>


            <div class="form-group">
                <label for="fecha" class="form-label">
                    Fecha de nacimiento:
                </label>

                <input
                    type="date"
                    id="fecha"
                    name="fecha"
                    class="form-input"
                    required
                    min="2000-01-01"
                    max="2010-12-31"
                >
            </div>

            <div class="form-group">
                <label for="edad" class="form-label">
                    Edad:
                </label>

                <input
                    type="number"
                    id="edad"
                    name="edad"
                    class="form-input"
                    min="16"
                    max="100"
                    required
                >
            </div>

            <div class="form-group">
                <label for="carrera" class="form-label">
                    Carrera Profesional:
                </label>

                <select
                    id="carrera"
                    name="carrera"
                    class="form-input"
                    required
                >
                    <option value="">Seleccione una carrera</option>
                    <option value="sistemas">Ingeniería de Sistemas</option>
                    <option value="informatica">Ingeniería Informática</option>
                    <option value="civil">Ingeniería Civil</option>
                    <option value="industrial">Ingeniería Industrial</option>
                </select>
            </div>

            <div class="form-group">
                <span class="form-label">Turno:</span>

                <label>
                    <input
                        type="radio"
                        name="turno"
                        value="manana"
                        required
                    >
                    Mañana
                </label>

                <label>
                    <input
                        type="radio"
                        name="turno"
                        value="tarde"
                    >
                    Tarde
                </label>

                <label>
                    <input
                        type="radio"
                        name="turno"
                        value="noche"
                    >
                    Noche
                </label>
            </div>

        </fieldset>

        <fieldset>
            <legend>Información de la Cuenta</legend>

            <div class="form-group">
                <label for="email" class="form-label">
                    Correo Institucional:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-input"
                    required
                    placeholder="usuario@universidad.edu.pe"
                >
            </div>

            <div class="form-group">
                <label for="password" class="form-label">
                    Contraseña:
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-input"
                    required
                    minlength="8"
                    pattern="(?=.*[A-Z])(?=.*[0-9]).{8,}"
                    placeholder="Mínimo 8 caracteres"
                >
            </div>

            <div class="form-group">
                <label for="comentarios" class="form-label">
                    Comentarios:
                </label>

                <textarea
                    id="comentarios"
                    name="comentarios"
                    class="form-input"
                    rows="5"
                    placeholder="Escriba algún comentario..."
                ></textarea>
            </div>

            <div class="form-group">
                <label>
                    <input
                        type="checkbox"
                        id="terminos"
                        name="terminos"
                        required
                    >
                    Acepto los términos y condiciones.
                </label>
            </div>

        </fieldset>


        <button type="submit" class="btn-submit">
            Registrar estudiante
        </button>

        <button type="reset" class="btn-reset">
            Limpiar formulario
        </button>

    </form>

</body>
</html>
